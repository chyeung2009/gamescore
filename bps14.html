<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格局14 Bingo Lucky Draw</title>
    <style>
        :root {
            --primary-orange: #FF7A00;
            --primary-blue: #0047FF;
            --bg-color: #F8F9FA;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Layout */
        .left-panel {
            flex: 6.5;
            display: flex;
            flex-direction: column;
            border-right: 4px solid var(--primary-blue);
            padding: 20px;
            background-color: #fff;
            height: 100%;
            overflow-y: auto;
        }

        .right-panel {
            flex: 3.5;
            display: flex;
            flex-direction: column;
            background-color: #EBF1FF;
            padding: 20px;
            position: relative;
            height: 100%;
        }

        /* Left Panel - Top */
        .left-top {
            flex: 0 1 auto;
            text-align: center;
            position: relative; /* 必須設定 relative 作為 absolute 的定位基準 */
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px; /* 給予一定高度避免縮得太細 */
        }
        
        .left-top h1 {
            color: var(--primary-blue);
            margin: 0;
            font-size: 4.5rem;
            line-height: 1;
            position: absolute; /* 絕對定位 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 完美置中 */
            z-index: 10;
            text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.8); /* 加上白色發光效果令標題更出 */
            pointer-events: none; /* 讓滑鼠點擊可以穿透，方便 Scroll 號碼 */
        }

        .available-numbers {
            font-size: 1rem;
            color: #666;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            align-content: flex-start;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            position: relative;
            z-index: 2;
            width: 100%;
        }
        
        .available-numbers span {
            background: rgba(238, 238, 238, 0.85);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            transition: all 0.3s;
            border: 1px solid #ddd;
        }

        /* Left Panel - Middle */
        .left-middle {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            min-height: 300px;
            padding-top: 10px;
        }

        .display-area {
            width: clamp(300px, 60vw, 640px);
            aspect-ratio: 16 / 10;
            height: auto;
            border: 8px solid var(--primary-orange);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--primary-orange);
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            flex-direction: column;
            padding: 10px 10px 40px 10px; /* 加大底部 padding，預留空間給倒數器避免遮擋 */
        }

        .countdown {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-orange);
            background: #fff;
            padding: 2px 10px;
            border-radius: 8px;
            border: 2px solid var(--primary-orange);
            display: none;
            letter-spacing: 1px;
            z-index: 10;
        }

        .flip-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
            margin-bottom: 25px;
        }

        .display-area img {
            width: clamp(80px, 15vw, 160px);
            height: clamp(80px, 15vw, 160px);
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid var(--primary-blue);
            margin-bottom: 5px;
            display: block;
            background-color: #eee;
        }

        #spin-number {
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1;
            margin-bottom: 5px;
            display: inline-block;
        }

        #result-desc {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            color: #555;
            text-align: center;
            font-weight: normal;
        }

        /* Flip Animation */
        .flip {
            animation: flipAnim 0.15s infinite;
        }

        @keyframes flipAnim {
            0% { transform: scaleY(1); opacity: 1; }
            50% { transform: scaleY(0); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* Left Panel - Bottom */
        .left-bottom {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            margin-top: 30px; /* 加入呢行，將 button 同上面嘅框框拉開距離 */
        }

        #start-btn {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 20px 80px;
            font-size: 2.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 122, 0, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #start-btn:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 25px rgba(255, 122, 0, 0.4);
        }

        #start-btn:active:not(:disabled) {
            transform: translateY(2px);
        }

        #start-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            color: #888;
        }

        /* Right Panel */
        .settings-container {
            text-align: right;
            margin-bottom: 20px;
        }

        #setting-icon {
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--primary-blue);
            transition: transform 0.3s;
        }

        #setting-icon:hover {
            transform: rotate(90deg);
        }

        .drawn-title {
            color: var(--primary-blue);
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 3px solid var(--primary-orange);
            padding-bottom: 15px;
            font-weight: bold;
        }

        .drawn-numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            align-content: flex-start;
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        .drawn-item {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-orange);
            background: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            border: 3px solid var(--primary-blue);
            box-shadow: 0 4px 8px rgba(0,71,255,0.1);
            /* 移除了 animation: popIn 避免每次更新時全部號碼又大又細 */
        }

        /* 移除了 @keyframes popIn */

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            border-top: 8px solid var(--primary-blue);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h2 { margin-top: 0; color: var(--primary-blue); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold;}
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.1rem;}
        .form-group input:focus { outline: none; border-color: var(--primary-orange); }
        
        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            flex: 1;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        .btn-primary { background-color: var(--primary-blue); color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }

        #setting-error {
            color: #dc3545;
            display: none;
            margin-bottom: 15px;
            font-weight: bold;
            background: #ffe6e6;
            padding: 10px;
            border-radius: 5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }
            .left-panel {
                border-right: none;
                border-bottom: 4px solid var(--primary-blue);
                overflow: visible;
            }
            .right-panel {
                min-height: 400px;
                overflow: visible;
            }
            #start-btn {
                padding: 15px 50px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>⚙️ 遊戲設定</h2>
            <div id="setting-error">設定無效，請確保結束號碼大於開始號碼，且時間大於0。</div>
            <div class="form-group">
                <label>開始號碼 (From):</label>
                <input type="number" id="set-min" value="1" min="1">
            </div>
            <div class="form-group">
                <label>結束號碼 (To):</label>
                <input type="number" id="set-max" value="70" min="2">
            </div>
            <div class="form-group">
                <label>抽獎翻轉時間 (秒):</label>
                <input type="number" id="set-time" value="10" min="1">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
                <button class="btn btn-danger" onclick="confirmReset()">重置遊戲</button>
                <button class="btn btn-primary" onclick="saveSettings()">儲存</button>
            </div>
        </div>
    </div>

    <!-- Confirm Reset Modal -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: #dc3545;">⚠️ 確定重置？</h2>
            <p style="font-size: 1.2rem; color: #555; margin: 20px 0;">這將會清除所有已抽出的紀錄，並重新開始遊戲。</p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
                <button class="btn btn-danger" onclick="executeReset()">確定重置</button>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="left-panel">
        <div class="left-top">
            <h1>格局14</h1>
            <div id="available-numbers" class="available-numbers">
                <!-- 候選號碼動態生成 -->
            </div>
        </div>
        <div class="left-middle">
            <div class="display-area" id="display-area">
                <div class="flip-container" id="flip-container">
                    <img id="result-image" src="" crossorigin="anonymous" alt="Result Image" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/0047FF/FFFFFF?text=Photo+Error'">
                    <span id="spin-number">READY</span>
                    <div id="result-desc">等待開始...</div>
                    <div id="countdown" class="countdown">10.0s</div>
                </div>
            </div>
        </div>
        <div class="left-bottom">
            <button id="start-btn" onclick="startDraw()">開始抽獎</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="settings-container">
            <button id="setting-icon" onclick="openSettings()" title="設定">⚙️</button>
        </div>
        <div class="drawn-title">已抽出號碼</div>
        <div id="drawn-numbers" class="drawn-numbers">
            <!-- 抽出號碼動態生成 -->
        </div>
    </div>

    <script>
        // Global Preferences
        let preferences = {
            min: 1,
            max: 70,
            spinDurationSeconds: 10
        };

        // Game State
        let availableNumbers = [];
        let drawnNumbers = [];
        let isSpinning = false;
        let spinInterval;
        let hideCountdownTimeout; // 新增這行：用來記錄並清除隱藏倒數計時的 timeout
        let imageFallbackTimeout; // 新增這行：用來記錄圖片載入逾時的 timeout 避免 race condition

        // DOM Elements
        const availableDiv = document.getElementById('available-numbers');
        const drawnDiv = document.getElementById('drawn-numbers');
        const spinNumberText = document.getElementById('spin-number');
        const resultImage = document.getElementById('result-image');
        const startBtn = document.getElementById('start-btn');
        const settingsModal = document.getElementById('settings-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const errorMsg = document.getElementById('setting-error');

        // New DOM Elements
        const countdownEl = document.getElementById('countdown');
        const descEl = document.getElementById('result-desc');
        const flipContainer = document.getElementById('flip-container');

        // 模擬的相片描述，可隨時替換成你自己的 data mapping
        function getDescription(num) {
            return `這是號碼 ${num} 的專屬相片描述`;
        }

        // Initialize Game
        function init() {
            availableNumbers = [];
            drawnNumbers = [];
            for (let i = preferences.min; i <= preferences.max; i++) {
                availableNumbers.push(i);
            }
            updateUI();
            resetDisplay();
        }

        // Update Left and Right panel numbers
        function updateUI() {
            // Update available numbers
            availableDiv.innerHTML = '';
            availableNumbers.forEach(num => {
                let span = document.createElement('span');
                span.textContent = num;
                availableDiv.appendChild(span);
            });

            // Update drawn numbers
            drawnDiv.innerHTML = '';
            drawnNumbers.forEach(num => {
                let div = document.createElement('div');
                div.className = 'drawn-item';
                div.textContent = num;
                drawnDiv.appendChild(div);
            });

            // Check game over state
            if (availableNumbers.length === 0) {
                startBtn.disabled = true;
                startBtn.textContent = '已抽完';
            } else {
                startBtn.disabled = false;
                startBtn.textContent = '開始抽獎';
            }
        }

        function resetDisplay() {
            spinNumberText.style.display = 'inline-block';
            spinNumberText.textContent = 'READY';
            resultImage.style.display = 'block';
            resultImage.onload = null; // 清除可能殘留的 onload 事件
            resultImage.src = 'https://via.placeholder.com/400x400/EBF1FF/0047FF?text=READY';
            descEl.textContent = '等待開始...';
            
            clearTimeout(hideCountdownTimeout); // 重置時也清一下
            countdownEl.style.display = 'none';
        }

        // Main Draw Logic
        function startDraw() {
            if (isSpinning || availableNumbers.length === 0) return;
            
            isSpinning = true;
            startBtn.disabled = true;
            startBtn.textContent = '抽獎中...';
            
            // 重要防呆：清除前一次抽獎殘留的 onload 事件，避免被 setInterval 瘋狂觸發
            resultImage.onload = null; 
            
            // 每次開始抽獎前，確保清除所有舊的 timeouts，防止 Async Race Condition
            clearTimeout(hideCountdownTimeout);
            clearTimeout(imageFallbackTimeout);
            
            countdownEl.style.display = 'block';
            countdownEl.textContent = preferences.spinDurationSeconds.toFixed(1) + 's';
            
            spinNumberText.classList.add('flip'); // 只對數字加 flip 效果

            const durationMs = preferences.spinDurationSeconds * 1000;
            const startTime = Date.now();

            // Start rapid switching effect
            spinInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                let remain = (durationMs - elapsed) / 1000;

                if (remain <= 0) {
                    remain = 0;
                    countdownEl.textContent = remain.toFixed(1) + 's';
                    finishDraw();
                    return;
                }

                countdownEl.textContent = remain.toFixed(1) + 's';

                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                const tempNum = availableNumbers[randomIndex];
                
                spinNumberText.textContent = tempNum;
                descEl.textContent = getDescription(tempNum);
                // 用較小尺寸的圖片以減輕連續載入時的網絡負擔 (200x200)
                resultImage.src = `https://picsum.photos/seed/${tempNum}/200/200`;
            }, 150); // 150ms 跳動一次
        }

        function finishDraw() {
            clearInterval(spinInterval);
            spinNumberText.classList.remove('flip'); // 移除數字的 flip 效果

            // Select final winner
            const winIndex = Math.floor(Math.random() * availableNumbers.length);
            const winNumber = availableNumbers.splice(winIndex, 1)[0];
            
            // 防呆：如果取不到號碼 (例如陣列已空)，直接退出
            if (winNumber === undefined) {
                isSpinning = false;
                updateUI();
                return;
            }

            drawnNumbers.push(winNumber);

            // Display final result
            spinNumberText.textContent = winNumber;
            descEl.textContent = getDescription(winNumber);
            countdownEl.textContent = '0.0s';
            
            // Load final high-res image
            const imgUrl = `https://picsum.photos/seed/${winNumber}/400/400`;
            
            resultImage.onload = () => {
                resultImage.onload = null; // 執行完後馬上自我清除
                clearTimeout(imageFallbackTimeout); // 圖片載入成功，清除 fallback timeout
                updateUI();
                isSpinning = false;
                // 延遲兩秒後隱藏倒數器，並記錄 timeout ID
                hideCountdownTimeout = setTimeout(() => { countdownEl.style.display = 'none'; }, 2000);
            };
            
            resultImage.src = imgUrl;

            // Fallback if image load takes too long (1.5秒後強制解除鎖定)
            imageFallbackTimeout = setTimeout(() => {
                updateUI();
                isSpinning = false; 
                hideCountdownTimeout = setTimeout(() => { countdownEl.style.display = 'none'; }, 2000);
            }, 1500);
        }

        // --- Settings Menu ---
        function openSettings() {
            if (isSpinning) return;
            errorMsg.style.display = 'none';
            document.getElementById('set-min').value = preferences.min;
            document.getElementById('set-max').value = preferences.max;
            document.getElementById('set-time').value = preferences.spinDurationSeconds;
            settingsModal.style.display = 'flex';
        }

        function closeSettings() {
            settingsModal.style.display = 'none';
        }

        function saveSettings() {
            const newMin = parseInt(document.getElementById('set-min').value);
            const newMax = parseInt(document.getElementById('set-max').value);
            const newTime = parseInt(document.getElementById('set-time').value);

            if (isNaN(newMin) || isNaN(newMax) || isNaN(newTime) || newMin >= newMax || newTime <= 0) {
                errorMsg.style.display = 'block';
                return;
            }

            preferences.min = newMin;
            preferences.max = newMax;
            preferences.spinDurationSeconds = newTime;
            
            closeSettings();
            init(); 
        }

        // --- Custom Confirm Reset ---
        function confirmReset() {
            closeSettings();
            confirmModal.style.display = 'flex';
        }

        function closeConfirm() {
            confirmModal.style.display = 'none';
        }

        function executeReset() {
            closeConfirm();
            init();
        }

        // 確保 DOM 完全載入後才執行初始化，避免空白畫面
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
