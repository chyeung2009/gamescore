<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格局14 Bingo Lucky Draw</title>
    <style>
        /* CSS 樣式與之前完全相同 */
        :root {
            --primary-orange: #FF7A00;
            --primary-blue: #0047FF;
            --bg-color: #F8F9FA;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Layout */
        .left-panel { flex: 6.5; display: flex; flex-direction: column; border-right: 4px solid var(--primary-blue); padding: 20px; background-color: #fff; height: 100%; overflow-y: auto; }
        .right-panel { flex: 3.5; display: flex; flex-direction: column; background-color: #EBF1FF; padding: 20px; position: relative; height: 100%; }

        /* Left Panel - Top */
        .left-top { flex: 0 1 auto; text-align: center; position: relative; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; min-height: 120px; }
        .left-top h1 { color: var(--primary-blue); margin: 0; font-size: 4.5rem; line-height: 1; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.8); pointer-events: none; }
        .available-numbers { font-size: 1rem; color: #666; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-content: flex-start; max-height: 150px; overflow-y: auto; padding: 10px; position: relative; z-index: 2; width: 100%; }
        .available-numbers span { background: rgba(238, 238, 238, 0.85); padding: 2px 5px; border-radius: 4px; font-size: 0.75rem; transition: all 0.3s; border: 1px solid #ddd; }

        /* Left Panel - Middle */
        .left-middle { flex: 1 1 auto; display: flex; justify-content: center; align-items: flex-start; position: relative; min-height: 300px; padding-top: 10px; }
        .display-area { width: clamp(300px, 60vw, 640px); aspect-ratio: 16 / 10; height: auto; border: 8px solid var(--primary-orange); border-radius: 20px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: var(--primary-orange); background-color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; position: relative; flex-direction: column; padding: 10px 10px 40px 10px; }
        .countdown { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); margin-top: 0; font-size: 1.2rem; font-weight: bold; color: var(--primary-orange); background: #fff; padding: 2px 10px; border-radius: 8px; border: 2px solid var(--primary-orange); display: none; letter-spacing: 1px; z-index: 10; }
        .flip-container { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; margin-bottom: 25px; }
        .display-area img { width: clamp(80px, 15vw, 160px); height: clamp(80px, 15vw, 160px); object-fit: cover; border-radius: 10px; border: 3px solid var(--primary-blue); margin-bottom: 5px; display: block; background-color: #eee; }
        #spin-number { font-size: clamp(2rem, 4vw, 3.5rem); line-height: 1; margin-bottom: 5px; display: inline-block; }
        #result-desc { font-size: clamp(1rem, 1.5vw, 1.2rem); color: #555; text-align: center; font-weight: normal; }
        .flip { animation: flipAnim 0.15s infinite; }
        @keyframes flipAnim { 0% { transform: scaleY(1); opacity: 1; } 50% { transform: scaleY(0); opacity: 0.5; } 100% { transform: scaleY(1); opacity: 1; } }

        /* Left Panel - Bottom */
        .left-bottom { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 120px; margin-top: 30px; }
        #start-btn { background-color: var(--primary-orange); color: white; border: none; padding: 20px 80px; font-size: 2.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 15px rgba(255, 122, 0, 0.3); transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 2px; }
        #start-btn:hover:not(:disabled) { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 25px rgba(255, 122, 0, 0.4); }
        #start-btn:active:not(:disabled) { transform: translateY(2px); }
        #start-btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; color: #888; }

        /* Right Panel */
        .settings-container { text-align: right; margin-bottom: 20px; }
        #setting-icon { font-size: 2rem; cursor: pointer; background: none; border: none; color: var(--primary-blue); transition: transform 0.3s; }
        #setting-icon:hover { transform: rotate(90deg); }
        .drawn-title { color: var(--primary-blue); font-size: 1.8rem; text-align: center; border-bottom: 3px solid var(--primary-orange); padding-bottom: 15px; font-weight: bold; }
        .drawn-numbers { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; align-content: flex-start; overflow-y: auto; flex: 1; padding-right: 5px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .drawn-item { font-size: 2rem; font-weight: bold; color: var(--primary-orange); background: #fff; padding: 10px 20px; border-radius: 10px; border: 3px solid var(--primary-blue); box-shadow: 0 4px 8px rgba(0,71,255,0.1); }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background-color: #fff; padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; border-top: 8px solid var(--primary-blue); box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal h2 { margin-top: 0; color: var(--primary-blue); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold;}
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.1rem;}
        .form-group input:focus { outline: none; border-color: var(--primary-orange); }
        .modal-actions { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; flex: 1; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--primary-blue); color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        #setting-error { color: #dc3545; display: none; margin-bottom: 15px; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 5px; }
        @media (max-width: 768px) { body { flex-direction: column; overflow-y: auto; } .left-panel { border-right: none; border-bottom: 4px solid var(--primary-blue); overflow: visible; } .right-panel { min-height: 400px; overflow: visible; } #start-btn { padding: 15px 50px; font-size: 2rem; } }
    </style>
</head>
<body>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>⚙️ 遊戲設定</h2>
            <div id="setting-error">設定無效，請確保結束號碼大於開始號碼，且時間大於0。</div>
            <div class="form-group">
                <label>開始號碼 (From):</label>
                <input type="number" id="set-min" value="1" min="1">
            </div>
            <div class="form-group">
                <label>結束號碼 (To):</label>
                <input type="number" id="set-max" value="62" min="2">
            </div>
            <div class="form-group">
                <label>抽獎翻轉時間 (秒):</label>
                <input type="number" id="set-time" value="5" min="1">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
                <button class="btn btn-danger" onclick="confirmReset()">重置遊戲</button>
                <button class="btn btn-primary" onclick="saveSettings()">儲存</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: #dc3545;">⚠️ 確定重置？</h2>
            <p style="font-size: 1.2rem; color: #555; margin: 20px 0;">這將會清除所有已抽出的紀錄，並重新開始遊戲。</p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
                <button class="btn btn-danger" onclick="executeReset()">確定重置</button>
            </div>
        </div>
    </div>

    <div class="left-panel">
        <div class="left-top">
            <h1>格局14</h1>
            <div id="available-numbers" class="available-numbers"></div>
        </div>
        <div class="left-middle">
            <div class="display-area" id="display-area">
                <div class="flip-container" id="flip-container">
                    <img id="result-image" src="" crossorigin="anonymous" alt="Result Image" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/0047FF/FFFFFF?text=Photo+Error'">
                    <span id="spin-number">READY</span>
                    <div id="result-desc">正在讀取設定中...</div>
                    <div id="countdown" class="countdown">5.0s</div>
                </div>
            </div>
        </div>
        <div class="left-bottom">
            <button id="start-btn" onclick="startDraw()" disabled>載入中...</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="settings-container">
            <button id="setting-icon" onclick="openSettings()" title="設定">⚙️</button>
        </div>
        <div class="drawn-title">已抽出號碼</div>
        <div id="drawn-numbers" class="drawn-numbers"></div>
    </div>

    <script>
        // 用來存放從 JSON 讀取進來的資料
        let photoData = {};

        // 讀取 JSON 檔案的非同步函數
        async function loadPhotoData() {
            try {
                // 讀取同一層目錄下的 photo_data.json
                const response = await fetch('photo_data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // 將 JSON 陣列轉換成 Object 方便快速查詢
                data.forEach(item => {
                    photoData[item.number] = {
                        filePath: item.file_path, // Python 產生的完整路徑 (例如 images/8/1 Mario.jpg)
                        description: item.description
                    };
                });
                
                console.log("成功載入圖片資料:", photoData);
                
                // 資料載入完成後，才初始化遊戲介面
                init();

            } catch (error) {
                console.error("載入 JSON 失敗:", error);
                alert("無法載入 photo_data.json！請確保你已使用 Local Server 啟動網頁，而非直接雙擊打開 HTML。");
                // 失敗的話依然初始化，但圖片會找不到
                init();
            }
        }

        // 取得相片對應的描述
        function getDescription(num) {
            if (photoData[num]) {
                return photoData[num].description;
            }
            return `未設定描述`;
        }

        // 取得相片對應的完整路徑
        function getFilePath(num) {
            if (photoData[num]) {
                return photoData[num].filePath; // 直接使用 JSON 提供的完整路徑
            }
            // 防呆預設路徑
            return `images/${num}.jpg`; 
        }

        // Global Preferences
        let preferences = { min: 1, max: 62, spinDurationSeconds: 5 };

        // Game State
        let availableNumbers = [];
        let drawnNumbers = [];
        let isSpinning = false;
        let spinInterval;
        let hideCountdownTimeout; 
        let imageFallbackTimeout; 

        // DOM Elements
        const availableDiv = document.getElementById('available-numbers');
        const drawnDiv = document.getElementById('drawn-numbers');
        const spinNumberText = document.getElementById('spin-number');
        const resultImage = document.getElementById('result-image');
        const startBtn = document.getElementById('start-btn');
        const settingsModal = document.getElementById('settings-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const errorMsg = document.getElementById('setting-error');
        const countdownEl = document.getElementById('countdown');
        const descEl = document.getElementById('result-desc');

        function init() {
            availableNumbers = [];
            drawnNumbers = [];
            for (let i = preferences.min; i <= preferences.max; i++) {
                availableNumbers.push(i);
            }
            updateUI();
            resetDisplay();
        }

        function updateUI() {
            availableDiv.innerHTML = '';
            availableNumbers.forEach(num => {
                let span = document.createElement('span');
                span.textContent = num;
                availableDiv.appendChild(span);
            });

            drawnDiv.innerHTML = '';
            drawnNumbers.forEach(num => {
                let div = document.createElement('div');
                div.className = 'drawn-item';
                div.textContent = num;
                drawnDiv.appendChild(div);
            });

            if (availableNumbers.length === 0) {
                startBtn.disabled = true;
                startBtn.textContent = '已抽完';
            } else {
                startBtn.disabled = false;
                startBtn.textContent = '開始抽獎';
            }
        }

        function resetDisplay() {
            spinNumberText.style.display = 'inline-block';
            spinNumberText.textContent = 'READY';
            resultImage.style.display = 'block';
            resultImage.onload = null; 
            resultImage.src = 'https://via.placeholder.com/400x400/EBF1FF/0047FF?text=READY';
            descEl.textContent = '等待開始...';
            
            clearTimeout(hideCountdownTimeout); 
            countdownEl.style.display = 'none';
        }

        function startDraw() {
            if (isSpinning || availableNumbers.length === 0) return;
            
            isSpinning = true;
            startBtn.disabled = true;
            startBtn.textContent = '抽獎中...';
            
            resultImage.onload = null; 
            clearTimeout(hideCountdownTimeout);
            clearTimeout(imageFallbackTimeout);
            
            countdownEl.style.display = 'block';
            countdownEl.textContent = preferences.spinDurationSeconds.toFixed(1) + 's';
            
            spinNumberText.classList.add('flip'); 

            const durationMs = preferences.spinDurationSeconds * 1000;
            const startTime = Date.now();

            spinInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                let remain = (durationMs - elapsed) / 1000;

                if (remain <= 0) {
                    remain = 0;
                    countdownEl.textContent = remain.toFixed(1) + 's';
                    finishDraw();
                    return;
                }

                countdownEl.textContent = remain.toFixed(1) + 's';

                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                const tempNum = availableNumbers[randomIndex];
                
                spinNumberText.textContent = tempNum;
                
                // 動態更新圖片與描述
                descEl.textContent = getDescription(tempNum);
                
                // 這裡改用 getFilePath，因為 JSON 已經提供完整的相對路徑了
                resultImage.src = getFilePath(tempNum); 
            }, 150); 
        }

        function finishDraw() {
            clearInterval(spinInterval);
            spinNumberText.classList.remove('flip'); 

            const winIndex = Math.floor(Math.random() * availableNumbers.length);
            const winNumber = availableNumbers.splice(winIndex, 1)[0];
            
            if (winNumber === undefined) {
                isSpinning = false;
                updateUI();
                return;
            }

            drawnNumbers.push(winNumber);

            spinNumberText.textContent = winNumber;
            
            // 最終結果的圖片與描述
            descEl.textContent = getDescription(winNumber);
            countdownEl.textContent = '0.0s';
            
            // 這裡改用 getFilePath
            const imgUrl = getFilePath(winNumber); 
            
            resultImage.onload = () => {
                resultImage.onload = null; 
                clearTimeout(imageFallbackTimeout); 
                updateUI();
                isSpinning = false;
                hideCountdownTimeout = setTimeout(() => { countdownEl.style.display = 'none'; }, 2000);
            };
            
            resultImage.src = imgUrl;

            imageFallbackTimeout = setTimeout(() => {
                updateUI();
                isSpinning = false; 
                hideCountdownTimeout = setTimeout(() => { countdownEl.style.display = 'none'; }, 2000);
            }, 1500);
        }

        // --- Settings Menu ---
        function openSettings() {
            if (isSpinning) return;
            errorMsg.style.display = 'none';
            document.getElementById('set-min').value = preferences.min;
            document.getElementById('set-max').value = preferences.max;
            document.getElementById('set-time').value = preferences.spinDurationSeconds;
            settingsModal.style.display = 'flex';
        }

        function closeSettings() { settingsModal.style.display = 'none'; }

        function saveSettings() {
            const newMin = parseInt(document.getElementById('set-min').value);
            const newMax = parseInt(document.getElementById('set-max').value);
            const newTime = parseInt(document.getElementById('set-time').value);

            if (isNaN(newMin) || isNaN(newMax) || isNaN(newTime) || newMin >= newMax || newTime <= 0) {
                errorMsg.style.display = 'block';
                return;
            }

            preferences.min = newMin;
            preferences.max = newMax;
            preferences.spinDurationSeconds = newTime;
            
            closeSettings();
            init(); 
        }

        function confirmReset() {
            closeSettings();
            confirmModal.style.display = 'flex';
        }

        function closeConfirm() { confirmModal.style.display = 'none'; }
        function executeReset() { closeConfirm(); init(); }

        // 確保 DOM 載入後，先執行 loadPhotoData() 讀取 JSON
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadPhotoData);
        } else {
            loadPhotoData();
        }
    </script>
</body>
</html>
