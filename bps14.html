<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Lucky Draw</title>
    <style>
        :root {
            --primary-black: #000000;
            --primary-gold: #DAA520;
            --bg-color: #F8F9FA;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-image: url('images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            overflow: hidden;
        }

        /* Layout */
        .left-panel { flex: 6.5; display: flex; flex-direction: column; border-right: 2px solid var(--primary-gold); padding: 20px; background-color: transparent; height: 100vh; overflow-y: auto; }
        .right-panel { flex: 3.5; display: flex; flex-direction: column; background-color: transparent; padding: 20px; position: relative; height: 100vh; overflow: hidden; }
        
        /* Left Panel - Top */
        .left-top { 
            flex: 0 1 auto; 
            text-align: center;
            position: relative; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 150px; 
        }
        
        .draw-info {
            position: absolute; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 20px;
            pointer-events: none; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(5px); 
            padding: 10px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            white-space: nowrap; 
        }

        #spin-number { 
            font-size: 5.5rem; 
            line-height: 1; 
            color: var(--primary-gold);
            font-weight: bold;
            text-shadow: 2px 2px 0px #fff;
        }
        
        #result-desc { 
            font-size: 2rem; 
            color: var(--primary-black); 
            font-weight: bold; 
            text-shadow: 1px 1px 0px #fff;
        }

        /* Left Panel - Middle */
        .left-middle { flex: 1 1 auto; display: flex; justify-content: center; align-items: center; position: relative; padding: 10px 0; }
        
        .display-area { 
            width: clamp(300px, 65vw, 850px); 
            aspect-ratio: 16 / 10; 
            max-height: 100%; 
            border: 3px solid var(--primary-black); 
            border-radius: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #f5f5f5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            overflow: hidden; 
            position: relative; 
            padding: 0; 
        }
        
        .display-area img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block; 
        }

        /* Flip Animation */
        .flip { animation: flipAnim 0.15s infinite; }
        @keyframes flipAnim { 0% { transform: scaleY(1); opacity: 1; } 50% { transform: scaleY(0); opacity: 0.5; } 100% { transform: scaleY(1); opacity: 1; } }

        /* Right Panel */
        .settings-container { flex: 0 0 auto; text-align: right; margin-bottom: 10px; }
        #setting-icon { font-size: 2rem; cursor: pointer; background: none; border: none; color: var(--primary-gold); transition: transform 0.3s; }
        #setting-icon:hover { transform: rotate(90deg); }
        .drawn-title { flex: 0 0 auto; color: var(--primary-gold); font-size: 1.8rem; text-align: center; border-bottom: 3px solid var(--primary-black); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; }
        
        .drawn-numbers { 
            flex: 1 1 0; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-content: flex-start; 
            overflow-y: auto; 
            padding: 15px; 
            background: rgba(255, 255, 255, 0.8); 
            border-radius: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #e8c978; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        
        .drawn-item { font-size: 2rem; font-weight: bold; color: var(--primary-black); background: #ffffff; padding: 10px 20px; border-radius: 10px; border: 2px solid var(--primary-gold); box-shadow: 0 4px 8px rgba(218,165,32,0.15); }

        .right-bottom {
            flex: 0 0 auto;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #d4af37;
            display: flex;
            justify-content: center;
        }

        #start-btn { 
            width: 100%;
            background-color: var(--primary-black); 
            color: white; 
            border: 2px solid var(--primary-gold);
            padding: 20px 0; 
            font-size: 2.2rem; 
            font-weight: bold; 
            border-radius: 20px; 
            cursor: pointer; 
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3); 
            transition: all 0.2s ease; 
            letter-spacing: 2px; 
        }
        #start-btn:hover:not(:disabled) { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4); }
        #start-btn:active:not(:disabled) { transform: translateY(2px); }
        #start-btn:disabled { background-color: #ccc; border-color: #ccc; cursor: not-allowed; box-shadow: none; color: #666; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background-color: #fff; padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; border-top: 8px solid var(--primary-gold); box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal h2 { margin-top: 0; color: var(--primary-gold); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold;}
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.1rem;}
        .form-group input:focus { outline: none; border-color: var(--primary-black); }
        .modal-actions { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; flex: 1; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--primary-gold); color: #000; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        #setting-error { color: #dc3545; display: none; margin-bottom: 15px; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 5px; }

        @media (max-width: 768px) { 
            body { flex-direction: column; overflow-y: auto; } 
            .left-panel { border-right: none; border-bottom: 2px solid var(--primary-gold); height: auto; min-height: 60vh;} 
            .right-panel { height: auto; min-height: 400px; overflow: visible; } 
            .drawn-numbers { flex: auto; overflow-y: visible; }
        }
    </style>
</head>
<body>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>⚙️ 遊戲設定</h2>
            <div id="setting-error">設定無效，請確保結束號碼大於開始號碼，且時間大於0。</div>
            <div class="form-group">
                <label>開始號碼 (From):</label>
                <input type="number" id="set-min" value="1" min="1">
            </div>
            <div class="form-group">
                <label>結束號碼 (To):</label>
                <input type="number" id="set-max" value="62" min="2">
            </div>
            <div class="form-group">
                <label>抽獎翻轉時間 (秒):</label>
                <input type="number" id="set-time" value="5" min="1">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
                <button class="btn btn-danger" onclick="confirmReset()">重置遊戲</button>
                <button class="btn btn-primary" onclick="saveSettings()">儲存</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: #dc3545;">⚠️ 確定重置？</h2>
            <p style="font-size: 1.2rem; color: #555; margin: 20px 0;">這將會清除所有已抽出的紀錄，並重新開始遊戲。</p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
                <button class="btn btn-danger" onclick="executeReset()">確定重置</button>
            </div>
        </div>
    </div>

    <div class="left-panel">
        <div class="left-top">
            <div class="draw-info">
                <span id="spin-number">READY</span>
                <div id="result-desc">等待開始...</div>
            </div>
        </div>
        
        <div class="left-middle">
            <div class="display-area" id="display-area">
                <!-- 移除了 HTML inline 的 onerror，改由 JS 統一管理 -->
                <img id="result-image" src="https://via.placeholder.com/800x500/f5f5f5/DAA520?text=READY" crossorigin="anonymous" alt="Result Image">
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="settings-container">
            <button id="setting-icon" onclick="openSettings()" title="設定">⚙️</button>
        </div>
        <div class="drawn-title">已抽出號碼</div>
        
        <div id="drawn-numbers" class="drawn-numbers"></div>
        
        <div class="right-bottom">
            <button id="start-btn" onclick="startDraw()" disabled>載入中...</button>
        </div>
    </div>

    <script>
        let photoData = {};

        async function loadPhotoData() {
            try {
                const response = await fetch('photo_data.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                data.forEach(item => {
                    photoData[item.number] = { filePath: item.file_path, description: item.description, photoClass: item.class };
                });
                init();
            } catch (error) {
                console.warn("載入 JSON 失敗，將使用預設設定:", error);
                init();
            }
        }

        function getDescription(num) {
            if (photoData[num]) {
                let desc = photoData[num].description;
                let pClass = photoData[num].photoClass;
                return (pClass && pClass !== "未分類") ? `${desc} (${pClass})` : desc;
            }
            return `號碼 ${num}`;
        }

        function getFilePath(num) {
            return photoData[num] ? photoData[num].filePath : `images/${num}.jpg`;
        }

        let preferences = { min: 1, max: 62, spinDurationSeconds: 5 };
        let availableNumbers = [];
        let drawnNumbers = [];
        let isSpinning = false;
        let spinInterval;
        let imageFallbackTimeout;

        const drawnDiv = document.getElementById('drawn-numbers');
        const spinNumberText = document.getElementById('spin-number');
        const resultImage = document.getElementById('result-image');
        const startBtn = document.getElementById('start-btn');
        const settingsModal = document.getElementById('settings-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const errorMsg = document.getElementById('setting-error');
        const descEl = document.getElementById('result-desc');

        function init() {
            availableNumbers = [];
            drawnNumbers = [];
            for (let i = preferences.min; i <= preferences.max; i++) availableNumbers.push(i);
            updateUI();
            resetDisplay();
        }

        function updateUI() {
            drawnDiv.innerHTML = '';
            drawnNumbers.forEach(num => {
                let div = document.createElement('div');
                div.className = 'drawn-item';
                div.textContent = num;
                drawnDiv.appendChild(div);
            });
            startBtn.disabled = (availableNumbers.length === 0);
            startBtn.textContent = (availableNumbers.length === 0) ? '已抽完' : '開始抽獎';
            drawnDiv.scrollTop = drawnDiv.scrollHeight;
        }

        function resetDisplay() {
            spinNumberText.textContent = 'READY';
            resultImage.src = 'https://via.placeholder.com/800x500/f5f5f5/DAA520?text=READY';
            descEl.textContent = '等待開始...';
        }

        function startDraw() {
            if (isSpinning || availableNumbers.length === 0) return;
            isSpinning = true;
            startBtn.disabled = true;
            spinNumberText.classList.add('flip');
            
            // 清理之前的事件綁定和 timeout
            resultImage.onload = null;
            resultImage.onerror = null;
            clearTimeout(imageFallbackTimeout);
            
            // 轉動期間如果圖片找不到，給一個安靜的 fallback
            resultImage.onerror = function() {
                this.src = 'https://via.placeholder.com/800x500/f5f5f5/DAA520?text=Loading...';
            };

            const durationMs = preferences.spinDurationSeconds * 1000;
            const startTime = Date.now();
            spinInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                let remain = (durationMs - elapsed) / 1000;
                if (remain <= 0) {
                    finishDraw();
                    return;
                }
                startBtn.textContent = `抽獎中 ${remain.toFixed(1)}s`;
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                const tempNum = availableNumbers[randomIndex];
                spinNumberText.textContent = tempNum;
                descEl.textContent = getDescription(tempNum);
                resultImage.src = getFilePath(tempNum);
            }, 150);
        }

        function finishDraw() {
            clearInterval(spinInterval);
            spinNumberText.classList.remove('flip');
            const winIndex = Math.floor(Math.random() * availableNumbers.length);
            const winNumber = availableNumbers.splice(winIndex, 1)[0];
            drawnNumbers.push(winNumber);
            
            spinNumberText.textContent = winNumber;
            descEl.textContent = getDescription(winNumber);
            
            // 處理最終圖片載入，確保 UI 解鎖
            resultImage.onload = null;
            resultImage.onerror = null;
            clearTimeout(imageFallbackTimeout);

            resultImage.onload = () => { 
                isSpinning = false; 
                updateUI(); 
            };
            
            resultImage.onerror = () => {
                // 若找不到圖片，顯示美觀的錯誤圖示，並解鎖按鈕
                resultImage.src = `https://via.placeholder.com/800x500/f5f5f5/DAA520?text=Photo+Missing+(${winNumber})`;
                isSpinning = false; 
                updateUI();
            };

            resultImage.src = getFilePath(winNumber);
            
            // 終極防呆：即使 onload/onerror 都掛掉，1.5 秒後也會強制解鎖
            imageFallbackTimeout = setTimeout(() => {
                if (isSpinning) {
                    isSpinning = false;
                    updateUI();
                }
            }, 1500);
        }

        function openSettings() { if (!isSpinning) settingsModal.style.display = 'flex'; }
        function closeSettings() { settingsModal.style.display = 'none'; }
        function saveSettings() {
            const newMin = parseInt(document.getElementById('set-min').value);
            const newMax = parseInt(document.getElementById('set-max').value);
            const newTime = parseInt(document.getElementById('set-time').value);
            if (isNaN(newMin) || isNaN(newMax) || isNaN(newTime) || newMin >= newMax || newTime <= 0) {
                errorMsg.style.display = 'block';
                return;
            }
            preferences.min = newMin; preferences.max = newMax; preferences.spinDurationSeconds = newTime;
            closeSettings(); init();
        }
        function confirmReset() { closeSettings(); confirmModal.style.display = 'flex'; }
        function closeConfirm() { confirmModal.style.display = 'none'; }
        function executeReset() { closeConfirm(); init(); }

        loadPhotoData();
    </script>
</body>
</html>
