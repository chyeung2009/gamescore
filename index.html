<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 計分 App Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基礎樣式保持不變 --- */
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0; padding: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 12px; }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; margin-bottom: 16px;
            background: rgba(255,255,255,0.95); border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); gap: 20px;
        }
        .logo-img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
        .logo-text {
            text-align: center; font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin: 0; line-height: 1.3;
            white-space: nowrap; padding-right: 24px;
        }
        
        /* --- Tabs --- */
        .tabs {
            display: flex; background: rgba(255,255,255,0.95);
            border-radius: 16px; padding: 4px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15); margin-bottom: 16px; gap: 4px;
        }
        .tab-btn {
            flex: 1; padding: 12px 16px; background: transparent;
            border: none; cursor: pointer; font-size: 16px; font-weight: 500;
            border-radius: 12px; transition: all 0.3s ease; color: #666;
        }
        .tab-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #feca57); color: white;
            transform: translateY(-1px); box-shadow: 0 4px 12px rgba(254,202,87,0.4);
        }
        .tab-content {
            display: none; background: rgba(255,255,255,0.95);
            padding: 20px; border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
            backdrop-filter: blur(12px); margin-bottom: 16px;
        }
        .tab-content.active { display: block; }

        /* --- Dashboard & Teams --- */
        .chart-container { position: relative; height: 400px; margin: 20px 0; border-radius: 16px; overflow: hidden; }
        .ranking { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
        .rank-item {
            padding: 20px; color: white; border-radius: 16px;
            text-align: center; font-size: 18px; font-weight: 700;
            transition: transform 0.3s ease;
        }
        .rank-num { font-size: 24px; color: #ffd700; }
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        
        .team {
            background: white; border-radius: 20px; padding: 24px 16px;
            text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .team::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 6px; background: var(--team-color);
        }
        .score {
            font-size: 56px; font-weight: 900; margin: 16px 0;
            color: #333;
        }
        
        /* --- 控制按鈕 --- */
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        button { cursor: pointer; transition: all 0.2s ease; border: none; }
        .btn-plus { background: #28a745; color: white; border-radius: 8px; padding: 10px; }
        .btn-minus { background: #dc3545; color: white; border-radius: 8px; padding: 10px; }
        .custom-input { display: flex; gap: 5px; margin-top: 15px; }
        .custom-input input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }

        /* --- 設定頁面專用樣式 --- */
        .setting-row {
            display: flex; align-items: center; gap: 15px;
            background: white; padding: 15px; border-radius: 12px;
            margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }
        .setting-row input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .setting-row input[type="color"] { width: 50px; height: 40px; border: none; cursor: pointer; background: none; }
        .setting-row input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }
        
        .csv-btn { background: #17a2b8; color: white; padding: 10px 20px; border-radius: 8px; }
        .reset-btn { background: #dc3545; color: white; padding: 15px 30px; border-radius: 12px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="learning_logo.jpg" alt="Logo" class="logo-img">
        <h1 class="logo-text">終身學習 商機無限 <br>We Are Learning!</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">🏆 Dashboard</button>
        <button class="tab-btn" onclick="switchTab(1)">⚡ 加減分</button>
        <button class="tab-btn" onclick="switchTab(2)">⚙️ 設定 / Log</button>
    </div>

    <div id="tab0" class="tab-content active">
        <h2>即時排名</h2>
        <div id="ranking" class="ranking"></div>
        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>
    </div>

    <div id="tab1" class="tab-content">
        <h2>快速計分</h2>
        <div id="teamsGrid" class="teams-grid"></div>
    </div>

    <div id="tab2" class="tab-content">
        <div class="setting-section">
            <h3>👥 隊伍管理 (6組)</h3>
            <div id="settingsContainer"></div>
            <button onclick="saveSettings()" class="csv-btn" style="background: #007bff; margin-top: 15px;">💾 保存所有設定</button>
        </div>

        <div class="setting-section" style="margin-top: 30px;">
            <h3>📈 最近 20 筆紀錄</h3>
            <table id="logTable">
                <thead><tr><th>時間</th><th>隊伍</th><th>變化</th><th>原因</th></tr></thead>
                <tbody></tbody>
            </table>
            <button onclick="exportCSV()" class="csv-btn" style="margin-top: 10px;">📥 匯出 CSV</button>
        </div>

        <div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd;">
            <button class="reset-btn" onclick="resetAll()">🗑️ 重設所有數據</button>
        </div>
    </div>
</div>

<script>
    // 定義 6 組原始 Key
    const teamKeys = ['team1', 'team2', 'team3', 'team4', 'team5', 'team6'];

    // 初始狀態
    let scores = { team1: 0, team2: 0, team3: 0, team4: 0, team5: 0, team6: 0 };
    let nicknames = { team1: '紅組', team2: '藍組', team3: '黃組', team4: '綠組', team5: '紫組', team6: '橘組' };
    let teamSettings = {
        team1: { enabled: true,  color: '#ff4757' },
        team2: { enabled: true,  color: '#3742fa' },
        team3: { enabled: true,  color: '#ffa502' },
        team4: { enabled: true,  color: '#2ed573' },
        team5: { enabled: false, color: '#a55eea' },
        team6: { enabled: false, color: '#fd9644' }
    };
    let logs = [];
    let chart = null;

    function loadData() {
        const sScores = localStorage.getItem('v3_scores');
        const sNicks  = localStorage.getItem('v3_nicks');
        const sSets   = localStorage.getItem('v3_sets');
        const sLogs   = localStorage.getItem('v3_logs');

        if (sScores) scores = JSON.parse(sScores);
        if (sNicks)  nicknames = JSON.parse(sNicks);
        if (sSets)   teamSettings = JSON.parse(sSets);
        if (sLogs)   logs = JSON.parse(sLogs);
        
        renderAll();
    }

    function saveData() {
        localStorage.setItem('v3_scores', JSON.stringify(scores));
        localStorage.setItem('v3_nicks',  JSON.stringify(nicknames));
        localStorage.setItem('v3_sets',   JSON.stringify(teamSettings));
        localStorage.setItem('v3_logs',   JSON.stringify(logs));
    }

    function getActiveTeams() {
        return teamKeys.filter(key => teamSettings[key].enabled);
    }

    function switchTab(idx) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('.tab-content').forEach((t, i) => t.classList.toggle('active', i === idx));
        if (idx === 0) updateChart();
        if (idx === 2) renderSettingsPanel();
    }

    function renderAll() {
        renderScoringGrid();
        updateRanking();
        updateChart();
        renderSettingsPanel();
        updateLogTable();
    }

    // Tab 1: 計分介面
    function renderScoringGrid() {
        const container = document.getElementById('teamsGrid');
        const active = getActiveTeams();
        container.innerHTML = active.map(key => `
            <div class="team" style="--team-color: ${teamSettings[key].color}">
                <div style="font-weight:bold; font-size:1.2rem">${nicknames[key]}</div>
                <div class="score">${scores[key]}</div>
                <div class="btn-grid">
                    <button class="btn-plus" onclick="changeScore('${key}', 1, '加1')">+1</button>
                    <button class="btn-plus" onclick="changeScore('${key}', 5, '加5')">+5</button>
                    <button class="btn-minus" onclick="changeScore('${key}', -1, '減1')">-1</button>
                    <button class="btn-minus" onclick="changeScore('${key}', -5, '減5')">-5</button>
                </div>
                <div class="custom-input">
                    <input type="number" id="custom-${key}" placeholder="自訂值">
                    <button class="btn-plus" onclick="customScore('${key}', true)">加</button>
                    <button class="btn-minus" onclick="customScore('${key}', false)">減</button>
                </div>
            </div>
        `).join('');
    }

    // Tab 0: 排名與圖表
    function updateRanking() {
        const active = getActiveTeams();
        const sorted = active.sort((a, b) => scores[b] - scores[a]);
        document.getElementById('ranking').innerHTML = sorted.map((key, i) => `
            <div class="rank-item" style="background: ${teamSettings[key].color}">
                <div class="rank-num">#${i+1}</div>
                <div>${nicknames[key]}</div>
                <div style="font-size: 1.5rem">${scores[key]} 分</div>
            </div>
        `).join('');
    }

    function updateChart() {
        const active = getActiveTeams();
        const ctx = document.getElementById('scoreChart').getContext('2d');
        const data = {
            labels: active.map(k => nicknames[k]),
            datasets: [{
                label: '分數',
                data: active.map(k => scores[k]),
                backgroundColor: active.map(k => teamSettings[k].color),
                borderRadius: 8
            }]
        };

        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    // Tab 2: 設定面板
    function renderSettingsPanel() {
        const container = document.getElementById('settingsContainer');
        container.innerHTML = teamKeys.map(key => `
            <div class="setting-row">
                <input type="checkbox" id="en-${key}" ${teamSettings[key].enabled ? 'checked' : ''}>
                <input type="color" id="clr-${key}" value="${teamSettings[key].color}">
                <input type="text" id="name-${key}" value="${nicknames[key]}" placeholder="隊伍名稱">
                <span style="color: #999; font-size: 0.8rem">${key.toUpperCase()}</span>
            </div>
        `).join('');
    }

    function saveSettings() {
        teamKeys.forEach(key => {
            teamSettings[key].enabled = document.getElementById(`en-${key}`).checked;
            teamSettings[key].color   = document.getElementById(`clr-${key}`).value;
            nicknames[key]            = document.getElementById(`name-${key}`).value || nicknames[key];
        });
        saveData();
        renderAll();
        alert('設定已成功保存！');
    }

    // 核心邏輯
    function changeScore(key, delta, reason) {
        const userReason = prompt(`[${nicknames[key]}] 分數變化 ${delta}，請輸入原因:`, reason);
        if (userReason === null) return; 

        scores[key] += delta;
        logs.push({
            time: new Date().toLocaleTimeString(),
            team: nicknames[key],
            change: delta > 0 ? `+${delta}` : delta,
            reason: userReason || reason
        });
        saveData();
        renderAll();
    }

    function customScore(key, isPlus) {
        const val = parseInt(document.getElementById(`custom-${key}`).value);
        if (isNaN(val)) return alert('請輸入有效數字');
        changeScore(key, isPlus ? val : -val, '自訂計分');
        document.getElementById(`custom-${key}`).value = '';
    }

    function updateLogTable() {
        const tbody = document.querySelector('#logTable tbody');
        tbody.innerHTML = logs.slice(-20).reverse().map(log => `
            <tr>
                <td>${log.time}</td>
                <td><b>${log.team}</b></td>
                <td style="color: ${log.change.toString().includes('+') ? 'green' : 'red'}">${log.change}</td>
                <td>${log.reason}</td>
            </tr>
        `).join('');
    }

    function exportCSV() {
        let csv = '\uFEFF時間,隊伍,變化,原因\n';
        logs.forEach(l => { csv += `${l.time},${l.team},${l.change},${l.reason}\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `scores_log_${new Date().toLocaleDateString()}.csv`;
        a.click();
    }

    function resetAll() {
        if (confirm('警告：這將會清除所有分數、歷史紀錄並恢復預設顏色！確定嗎？')) {
            localStorage.clear();
            location.reload();
        }
    }

    loadData();
</script>
</body>
</html>
