<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 計分 App</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 12px; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            margin-bottom: 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            gap: 20px;
        }
        .logo-img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .logo-text {
            flex: 1;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1.3;
        }
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            margin-bottom: 16px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            border-radius: 12px;
            transition: all 0.3s ease;
            color: #666;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .tab-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(254,202,87,0.4);
        }
        .tab-content {
            display: none;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
            margin-bottom: 16px;
        }
        .tab-content.active { display: block; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; font-size: 24px; font-weight: 700; }
        h3 { color: #444; margin-bottom: 16px; }
        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .ranking {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }
        .rank-item {
            padding: 20px;
            color: white;
            border-radius: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            transition: transform 0.3s ease;
        }
        .rank-item:hover { transform: translateY(-3px); }
        .rank-num { font-size: 24px; color: #ffd700; margin-bottom: 6px; }
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
        .team {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.75));
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .team::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--team-color, #999);
        }
        .team:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.15); }
        .team-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #333; }
        .score {
            font-size: 56px;
            font-weight: 900;
            margin: 12px 0;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        button {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            font-family: 'Noto Sans TC', sans-serif;
        }
        .btn-plus  { background: linear-gradient(45deg, #28a745, #20c997); color: white; }
        .btn-minus { background: linear-gradient(45deg, #dc3545, #fd7e14); color: white; }
        .btn-plus:hover  { transform: scale(1.04); }
        .btn-minus:hover { transform: scale(1.04); }
        .custom-input {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.6);
            border-radius: 12px;
            align-items: center;
        }
        .custom-input input[type="number"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Noto Sans TC', sans-serif;
            min-width: 0;
        }
        .setting-section {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.6);
            border-radius: 16px;
        }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }
        .setting-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            cursor: pointer;
            min-width: 70px;
            color: #444;
        }
        .setting-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #667eea;
            cursor: pointer;
        }
        .setting-row input[type="color"] {
            width: 48px;
            height: 40px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            padding: 2px;
            background: white;
        }
        .setting-row input[type="text"] {
            flex: 1;
            min-width: 140px;
            padding: 10px 14px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Noto Sans TC', sans-serif;
            color: #333;
        }
        .setting-row input[type="text"]:focus,
        .setting-row input[type="color"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .team-label-badge {
            font-size: 13px;
            font-weight: 700;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            min-width: 48px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        th { background: linear-gradient(45deg, #667eea, #764ba2); color: white; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }
        .reset-btn {
            background: linear-gradient(45deg, #dc3545, #c82333);
            color: white;
            padding: 14px 36px;
            font-size: 16px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(220,53,69,0.3);
        }
        .save-btn {
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            padding: 12px 28px;
            font-size: 14px;
            border-radius: 10px;
            margin-top: 12px;
        }
        .csv-btn {
            background: linear-gradient(45deg, #17a2b8, #138496);
            color: white;
            padding: 12px 28px;
            font-size: 14px;
            border-radius: 10px;
            margin-top: 12px;
        }
        @media (max-width: 768px) {
            .logo-text { font-size: 22px; }
            .score { font-size: 44px; }
            .teams-grid { grid-template-columns: 1fr; }
            .tab-btn { font-size: 13px; padding: 10px 8px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <img src="learning_logo.jpg" alt="Logo" class="logo-img">
        <h1 class="logo-text">終身學習 商機無限<br>We Are Learning!</h1>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">🏆 Dashboard</button>
        <button class="tab-btn"        onclick="switchTab(1)">⚡ 加減分</button>
        <button class="tab-btn"        onclick="switchTab(2)">📊 Log / 設定</button>
    </div>

    <!-- TAB 0: Dashboard -->
    <div id="tab0" class="tab-content active">
        <h2>即時分數總覽</h2>
        <div id="ranking" class="ranking"></div>
        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>
    </div>

    <!-- TAB 1: 加減分 -->
    <div id="tab1" class="tab-content">
        <h2>快速計分操作</h2>
        <div id="teams" class="teams-grid"></div>
    </div>

    <!-- TAB 2: Log / 設定 -->
    <div id="tab2" class="tab-content">

        <div class="setting-section">
            <h3>🏷️ 隊伍設定（啟用 ／ 顏色 ／ 名稱）</h3>
            <div id="settingsContainer"></div>
            <button class="save-btn" onclick="saveSettings()">💾 保存設定</button>
        </div>

        <div class="setting-section">
            <h3>📈 比分紀錄（最近 20 筆）</h3>
            <table id="logTable">
                <thead>
                    <tr><th>時間</th><th>組別</th><th>分數變化</th><th>原因</th></tr>
                </thead>
                <tbody></tbody>
            </table>
            <button class="csv-btn" onclick="exportCSV()">📥 匯出 CSV</button>
        </div>

        <div style="text-align:center; padding:28px; background:rgba(220,53,69,0.08); border-radius:16px; margin-top:24px;">
            <button class="reset-btn" onclick="resetAll()">🗑️ 重設全部數據</button>
        </div>

    </div>
</div>

<script>
    /* ── 常數與預設值 ── */
    var ALL_TEAMS = ['team1','team2','team3','team4','team5','team6'];

    var DEFAULT_SCORES = { team1:0, team2:0, team3:0, team4:0, team5:0, team6:0 };
    var DEFAULT_NICKS  = { team1:'紅組', team2:'藍組', team3:'黃組', team4:'綠組', team5:'紫組', team6:'橘組' };
    var DEFAULT_SETTINGS = {
        team1:{ enabled:true,  color:'#ff4757' },
        team2:{ enabled:true,  color:'#3742fa' },
        team3:{ enabled:true,  color:'#ffa502' },
        team4:{ enabled:true,  color:'#2ed573' },
        team5:{ enabled:false, color:'#9b59b6' },
        team6:{ enabled:false, color:'#e67e22' }
    };

    /* ── 工作資料（深複製預設值）── */
    var scores      = JSON.parse(JSON.stringify(DEFAULT_SCORES));
    var nicknames   = JSON.parse(JSON.stringify(DEFAULT_NICKS));
    var teamSettings= JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    var logs        = [];
    var chartObj    = null;

    /* ── 載入 localStorage ── */
    function loadData() {
        try {
            var s  = localStorage.getItem('gsc_scores');
            var n  = localStorage.getItem('gsc_nicks');
            var st = localStorage.getItem('gsc_settings');
            var l  = localStorage.getItem('gsc_logs');
            if (s)  scores       = JSON.parse(s);
            if (n)  nicknames    = JSON.parse(n);
            if (st) teamSettings = JSON.parse(st);
            if (l)  logs         = JSON.parse(l).slice(-200);
        } catch(e) { console.warn('loadData error', e); }
        renderAll();
    }

    function saveData() {
        try {
            localStorage.setItem('gsc_scores',   JSON.stringify(scores));
            localStorage.setItem('gsc_nicks',    JSON.stringify(nicknames));
            localStorage.setItem('gsc_settings', JSON.stringify(teamSettings));
            localStorage.setItem('gsc_logs',     JSON.stringify(logs));
        } catch(e) { console.warn('saveData error', e); }
    }

    /* ── Tab 切換 ── */
    function switchTab(index) {
        var btns = document.querySelectorAll('.tab-btn');
        var tabs = document.querySelectorAll('.tab-content');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('active', i === index);
            tabs[i].classList.toggle('active', i === index);
        }
        if (index === 0) updateChart();
        if (index === 2) renderSettingsPanel();
    }

    /* ── 取得已啟用的隊伍 ── */
    function getActiveTeams() {
        var result = [];
        for (var i = 0; i < ALL_TEAMS.length; i++) {
            if (teamSettings[ALL_TEAMS[i]].enabled) result.push(ALL_TEAMS[i]);
        }
        return result;
    }

    /* ── 渲染全部 ── */
    function renderAll() {
        renderTeams();
        updateRanking();
        updateChart();
        renderSettingsPanel();
        updateLogTable();
    }

    /* ── 加減分頁面 ── */
    function renderTeams() {
        var activeTeams = getActiveTeams();
        var html = '';
        for (var i = 0; i < activeTeams.length; i++) {
            var t = activeTeams[i];
            html += '<div class="team" style="--team-color:' + teamSettings[t].color + '">';
            html += '<div class="team-name">' + nicknames[t] + '</div>';
            html += '<div class="score">' + scores[t] + '</div>';
            html += '<div class="btn-grid">';
            html += '<button class="btn-plus"  onclick="doChange(\'' + t + '\', 1)">+1</button>';
            html += '<button class="btn-plus"  onclick="doChange(\'' + t + '\', 5)">+5</button>';
            html += '<button class="btn-minus" onclick="doChange(\'' + t + '\', -1)">-1</button>';
            html += '<button class="btn-minus" onclick="doChange(\'' + t + '\', -5)">-5</button>';
            html += '</div>';
            html += '<div class="custom-input">';
            html += '<input type="number" id="ci-' + t + '" placeholder="自訂分數">';
            html += '<button class="btn-plus"  onclick="customScore(\'' + t + '\', true)">加</button>';
            html += '<button class="btn-minus" onclick="customScore(\'' + t + '\', false)">減</button>';
            html += '</div></div>';
        }
        document.getElementById('teams').innerHTML = html;
    }

    /* ── Dashboard 排名 ── */
    function updateRanking() {
        var activeTeams = getActiveTeams().slice();
        activeTeams.sort(function(a, b){ return scores[b] - scores[a]; });
        var medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
        var html = '';
        for (var i = 0; i < activeTeams.length; i++) {
            var t = activeTeams[i];
            var c = teamSettings[t].color;
            html += '<div class="rank-item" style="background:' + c + '; box-shadow:0 6px 20px ' + c + '88;">';
            html += '<div class="rank-num">' + (i+1) + ' ' + (medals[i] || '') + '</div>';
            html += '<div>' + nicknames[t] + ' &nbsp;<span style="font-size:22px;">' + scores[t] + ' 分</span></div>';
            html += '</div>';
        }
        document.getElementById('ranking').innerHTML = html;
    }

    /* ── Chart.js 圖表 ── */
    function updateChart() {
        var activeTeams = getActiveTeams();
        var labels = [];
        var data   = [];
        var bgColors = [];
        for (var i = 0; i < activeTeams.length; i++) {
            labels.push(nicknames[activeTeams[i]]);
            data.push(scores[activeTeams[i]]);
            bgColors.push(teamSettings[activeTeams[i]].color);
        }

        var ctx = document.getElementById('scoreChart').getContext('2d');
        if (chartObj !== null) {
            chartObj.destroy();
            chartObj = null;
        }

        /* ✅ 完整正確的 Chart.js 初始化寫法 */
        chartObj = new Chart(ctx, {
            type: 'bar',
             {
                labels: labels,
                datasets: [{
                    label: '分數',
                     data,
                    backgroundColor: bgColors,
                    borderWidth: 0,
                    borderRadius: 10,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { font: { size: 14 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 16, weight: 'bold' } }
                    }
                },
                animation: { duration: 800, easing: 'easeOutQuart' }
            }
        });
    }

    /* ── 設定面板 ── */
    function renderSettingsPanel() {
        var html = '';
        for (var i = 0; i < ALL_TEAMS.length; i++) {
            var t = ALL_TEAMS[i];
            var checked = teamSettings[t].enabled ? 'checked' : '';
            html += '<div class="setting-row">';
            html += '<span class="team-label-badge" style="background:' + teamSettings[t].color + '">隊' + (i+1) + '</span>';
            html += '<label><input type="checkbox" id="en-' + t + '" ' + checked + '> 啟用</label>';
            html += '<input type="color" id="col-' + t + '" value="' + teamSettings[t].color + '" title="選擇顏色">';
            html += '<input type="text"  id="nk-'  + t + '" value="' + nicknames[t] + '" placeholder="隊伍名稱">';
            html += '</div>';
        }
        document.getElementById('settingsContainer').innerHTML = html;
    }

    function saveSettings() {
        for (var i = 0; i < ALL_TEAMS.length; i++) {
            var t   = ALL_TEAMS[i];
            var en  = document.getElementById('en-'  + t).checked;
            var col = document.getElementById('col-' + t).value;
            var nk  = document.getElementById('nk-'  + t).value;
            teamSettings[t].enabled = en;
            teamSettings[t].color   = col;
            if (nk.trim() !== '') nicknames[t] = nk.trim();
        }
        saveData();
        renderAll();
        alert('✅ 設定已保存！');
    }

    /* ── 計分操作 ── */
    function doChange(team, delta) {
        var reason = prompt('原因（可空白）：');
        if (reason === null) return; /* 按取消則不計分 */
        reason = reason || (delta > 0 ? '+' + delta : String(delta));
        changeScore(team, delta, reason);
    }

    function customScore(team, isAdd) {
        var input = document.getElementById('ci-' + team);
        var val   = parseInt(input.value, 10);
        if (isNaN(val) || val <= 0) { alert('請輸入正整數！'); return; }
        var delta  = isAdd ? val : -val;
        var reason = prompt('原因（可空白）：');
        if (reason === null) return;
        reason = reason || (isAdd ? '加自訂' : '減自訂');
        changeScore(team, delta, reason);
        input.value = '';
    }

    function changeScore(team, delta, reason) {
        scores[team] += delta;
        var now = new Date();
        var timeStr = now.toLocaleString('zh-TW');
        logs.push({ time: timeStr, team: nicknames[team], change: delta, reason: reason });
        saveData();
        renderAll();
    }

    /* ── Log 表格 ── */
    function updateLogTable() {
        var recent = logs.slice(-20).reverse();
        var html = '';
        for (var i = 0; i < recent.length; i++) {
            var row = recent[i];
            var color = row.change > 0 ? '#28a745' : '#dc3545';
            var sign  = row.change > 0 ? '+' : '';
            html += '<tr>';
            html += '<td>' + row.time + '</td>';
            html += '<td style="font-weight:600;">' + row.team + '</td>';
            html += '<td style="color:' + color + '; font-weight:800; font-size:16px;">' + sign + row.change + '</td>';
            html += '<td>' + row.reason + '</td>';
            html += '</tr>';
        }
        document.querySelector('#logTable tbody').innerHTML = html;
    }

    /* ── 匯出 CSV ── */
    function exportCSV() {
        var bom = '\uFEFF';
        var lines = ['時間,組別,變化,原因'];
        var allLogs = logs.slice().reverse();
        for (var i = 0; i < allLogs.length; i++) {
            var r = allLogs[i];
            lines.push('"' + r.time + '","' + r.team + '",' + r.change + ',"' + r.reason.replace(/"/g,'""') + '"');
        }
        var csv  = bom + lines.join('\n');
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var url  = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href     = url;
        link.download = 'score_log_' + new Date().toISOString().slice(0,10) + '.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    /* ── 重設 ── */
    function resetAll() {
        if (!confirm('⚠️ 確定重設全部？\n• 分數歸零\n• Log 清空\n• 設定還原預設')) return;
        scores       = JSON.parse(JSON.stringify(DEFAULT_SCORES));
        nicknames    = JSON.parse(JSON.stringify(DEFAULT_NICKS));
        teamSettings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        logs         = [];
        localStorage.removeItem('gsc_scores');
        localStorage.removeItem('gsc_nicks');
        localStorage.removeItem('gsc_settings');
        localStorage.removeItem('gsc_logs');
        renderAll();
    }

    /* ── 啟動 ── */
    loadData();
</script>
</body>
</html>
